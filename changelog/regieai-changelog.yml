- date: '2026-05-28'
  title: Safer Salesforce Trigger Execution
  url: https://www.regie.ai/changelog/safer-salesforce-trigger-execution
  areas:
  - Integrations
  highlights:
  - Triggers now check for a terminal state before firing, so finished and removed prospects keep their correct Salesforce Lead Status instead of being flipped back from Nurture to Working by a delayed activity update.
- date: '2026-05-28'
  title: Faster Agent Launch + Prospect Touch Visibility
  url: https://www.regie.ai/changelog/faster-agent-launch-prospect-touch-visibility
  areas:
  - AI Agents
  highlights:
  - Newly launched agents prioritize task generation, improving time-to-first-task.
  - Prospect page inside an agent shows total touches instead of average touches.
- date: '2026-05-28'
  title: Shareable Agent Drafts + Audit Logs
  url: https://www.regie.ai/changelog/shareable-agent-drafts-audit-logs
  areas:
  - AI Agents
  highlights:
  - Read-only agent drafts can be shared for pre-publish review of prompt and Salesforce field changes.
  - Stronger draft state with audit logging across all agent edits.
- date: '2026-05-26'
  title: Auto-Open Company Websites + Inbound Call Improvements
  url: https://www.regie.ai/changelog/auto-open-company-websites-inbound-call-improvements
  areas:
  - Dialer
  highlights:
  - Dialer can auto-open the prospect's company website on connect, with an in-call website shortcut.
  - Inbound calls support disposition edits; no-answer and forwarded calls log correctly and stay in call history.
- date: '2026-05-12'
  title: Pickup-Rate Rotation for All + Competitor Activity Dashboard
  url: https://www.regie.ai/changelog/pickup-rate-rotation-competitor-activity
  areas:
  - Dialer
  - Analytics
  highlights:
  - Pickup-rate-based outbound number rotation enabled across every dialer-enabled workspace.
  - Competitor Activity dashboard classifies CRM-logged calls by dialer source (Regie, Outreach, Nooks, ConnectAndSell, SalesLoft).
  - Prospect-side jitter buffer and a retuned XGBoost answering-machine-detection model.
