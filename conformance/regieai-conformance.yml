- id: eu-ai-act
  conforms: partial
  evidence: >-
    "As a low-risk provider under the AI Act, Regie.ai is already preparing to ensure continued
    compliance as the regulatory landscape evolves." — self-classification on the GDPR page.
    Preparation stated, no conformity assessment published.
- id: salesforce-appexchange-security
  conforms: true
  evidence: AppExchange security certification referenced alongside SOC 2 on the GDPR page.
- id: oidc
  conforms: true
  evidence: >-
    Two Regie.ai-hosted identity tenants serve valid OpenID Connect discovery documents at HTTP
    200 — authenticate.regie.ai (Auth0) and authkit.regie.ai (WorkOS AuthKit) — both advertising
    authorization_code, refresh_token, client_credentials and device_code grants. This is the
    only standard on this list verified by a machine-readable document rather than a prose claim.
- id: oauth2
  conforms: true
  evidence: >-
    Both identity tenants also serve RFC 8414 OAuth 2.0 Authorization Server Metadata at
    /.well-known/oauth-authorization-server (HTTP 200). authenticate.regie.ai advertises PKCE
    S256.
- id: rfc9457
