- id: gdpr
  conforms: true
  evidence: >-
    Dedicated GDPR page (last updated 2025-04-03) describing Regie.ai's role as data processor,
    a fixed sub-processor list available on request, a 30-day breach-notification window, a
    30-day data-subject-request window and 30-day return-or-delete on termination.
- id: ccpa
  conforms: partial
  evidence: >-
    "Regie.ai also acknowledges the importance of other data protection laws, such as the
