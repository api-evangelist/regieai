name: Regie.ai
description: 'Regie.ai is an AI-powered sales engagement platform that helps B2B sales
  teams scale outbound without adding headcount. Its flagship product, RegieOne, unifies
  AI agents with human reps to automate prospecting: lead research and enrichment,
  personalized multichannel messaging (email, phone, LinkedIn), AI dialing (power
  and parallel), dynamic lead prioritization from intent signals, sequence orchestration,
  and CRM integration (Salesforce, Outreach). It serves SDRs, account executives,
  sales leaders, and RevOps teams. Regie.ai is backed by Scale Venture Partners.'
